name: Build

# - Every push / pull request: compile FocusKit.exe and keep it as a downloadable build artifact.
# - Pushing a version tag (e.g. v1.1.0): build, then publish a GitHub Release with the exe,
#   a zip, and SHA-256 checksums.
# - Run manually with a tag: rebuild that tag and replace the files on its existing release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and attach to its release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Compile with the .NET Framework C# compiler built into Windows
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item FocusKit.exe dist/
          Compress-Archive -Path FocusKit.exe, README.md, LICENSE -DestinationPath "dist/FocusKit-$env:TAG.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FocusKit-${{ env.TAG }}
          path: dist/

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "FocusKit $($env:TAG.TrimStart('v'))" --generate-notes
          }
